/* unify card footer with full card */
.pbody{background:transparent !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important;border-top:0 !important;box-shadow:none !important}
.price,.pname{background:transparent !important;box-shadow:none !important}

/* NEXT LEVEL FOLDER DOCK + MACOS REVEAL */
.folder-view{
  perspective:1200px;
  align-items:stretch;
}
.folder-card{
  position:relative;
  min-height:172px;
  border-radius:32px;
  overflow:hidden;
  background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.42)) !important;
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  box-shadow:0 30px 80px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.75);
  transform-style:preserve-3d;
}
.folder-card::before{
  content:"";
  position:absolute;
  right:-20px;
  top:24px;
  width:130px;
  height:92px;
  border-radius:28px;
  background:linear-gradient(135deg,rgba(156,255,74,.55),rgba(155,111,255,.25));
  transform:rotate(-8deg);
  opacity:.7;
}
.folder-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.55),transparent 42%,rgba(0,0,0,.035));
  pointer-events:none;
}
.folder-card:hover{
  transform:translateY(-10px) rotateX(4deg) rotateY(-4deg) scale(1.025);
}
.folder-icon,.folder-name,.folder-count,.folder-open{position:relative;z-index:2}
.folder-icon{
  width:54px;height:54px;border-radius:20px;
  background:#fff;
  box-shadow:0 18px 38px rgba(0,0,0,.12);
}
.folder-open{
  background:#111;color:#fff;
  box-shadow:0 14px 28px rgba(0,0,0,.18);
}
[data-theme="dark"] .folder-card{
  background:linear-gradient(145deg,rgba(35,28,55,.72),rgba(20,16,34,.42)) !important;
  box-shadow:0 30px 90px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.12);
}
[data-theme="dark"] .folder-card::before{
  background:linear-gradient(135deg,rgba(156,255,74,.42),rgba(128,78,255,.38));
}
[data-theme="dark"] .folder-open{background:#fff;color:#111}
.spinner-wrap.reveal-in{
  animation:macReveal .85s cubic-bezier(.16,1,.3,1) both;
  transform-origin:center top;
}
@keyframes macReveal{
  0%{opacity:0;transform:translateY(55px) rotateX(34deg) rotateZ(-3deg) scale(.78);filter:blur(14px)}
  58%{opacity:1;transform:translateY(-8px) rotateX(-5deg) rotateZ(.8deg) scale(1.025);filter:blur(0)}
  100%{opacity:1;transform:translateY(0) rotateX(0) rotateZ(0) scale(1);filter:blur(0)}
}
/* cardFlowIn removed: it was overriding 3D spinner transforms */
  to{opacity:1;filter:blur(0);transform:var(--end-transform, none)}
}

/* SPINNER RESTORE: never animate .panel transform directly */
.panel{animation:none !important;}
.panel:hover{transform-style:preserve-3d !important;}
.panel:active{filter:brightness(.96) !important;}
.spinner-wrap.reveal-in{animation:macReveal .85s cubic-bezier(.16,1,.3,1) both;transform-origin:center top}
@keyframes macReveal{0%{opacity:0;transform:translateY(55px) rotateX(34deg) rotateZ(-3deg) scale(.78);filter:blur(14px)}58%{opacity:1;transform:translateY(-8px) rotateX(-5deg) rotateZ(.8deg) scale(1.025);filter:blur(0)}100%{opacity:1;transform:translateY(0) rotateX(0) rotateZ(0) scale(1);filter:blur(0)}}

/* LEFT PRODUCT FOCUS DETAIL */
.product-focus{display:none;width:min(100%,1080px);min-height:430px;grid-template-columns:420px 1fr;gap:2rem;align-items:center;position:relative}.product-focus.open{display:grid}.product-focus.open~.spinner-wrap{opacity:.15;filter:blur(8px);transform:scale(.88);pointer-events:none}.product-focus.open~.spin-nav{opacity:.25}.focus-card{justify-self:center;width:330px;border-radius:34px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid var(--border);box-shadow:0 36px 120px rgba(0,0,0,.45);animation:focusCardIn .75s cubic-bezier(.16,1,.3,1) both}.focus-card img{width:100%;height:330px;object-fit:cover;display:block}.focus-card-body{padding:1rem 1.1rem}.focus-card-title{font-size:1.15rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.focus-card-price{font-size:2rem;font-weight:800;margin-top:.35rem}.focus-info{padding:1.2rem 0;max-width:520px}.focus-kicker{color:var(--gold);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:.45rem}.focus-title{font-family:'Cormorant Garamond',serif;font-size:clamp(2.1rem,4vw,4rem);line-height:.95;margin-bottom:.8rem}.focus-desc{color:var(--muted);line-height:1.65;margin-bottom:1.1rem}.focus-row{display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:.65rem 0;color:var(--muted)}.focus-row b{color:var(--text)}.focus-prices{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin:1.2rem 0}.focus-price-box{border:1px solid var(--border);border-radius:20px;padding:1rem;background:rgba(255,255,255,.05)}.focus-price-box small{color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.12em}.focus-price-box strong{display:block;font-size:1.55rem;margin-top:.35rem}.focus-actions{display:flex;gap:.75rem;flex-wrap:wrap}.focus-close{position:absolute;left:.2rem;top:.2rem;width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:rgba(255,255,255,.08);color:var(--text);cursor:pointer}.flow-line{display:block;opacity:0;transform:translateY(22px);animation:flowLine .52s cubic-bezier(.16,1,.3,1) forwards}.flow-line:nth-child(1){animation-delay:.04s}.flow-line:nth-child(2){animation-delay:.1s}.flow-line:nth-child(3){animation-delay:.16s}.flow-line:nth-child(4){animation-delay:.22s}.flow-line:nth-child(5){animation-delay:.28s}@keyframes flowLine{to{opacity:1;transform:translateY(0)}}@keyframes focusCardIn{0%{opacity:0;transform:translateX(240px) rotateY(-24deg) scale(.62);filter:blur(12px)}60%{opacity:1;transform:translateX(-12px) rotateY(6deg) scale(1.03);filter:blur(0)}100%{opacity:1;transform:translateX(0) rotateY(0) scale(1);filter:blur(0)}}@media(max-width:850px){.product-focus.open{grid-template-columns:1fr;gap:1rem}.focus-card{width:260px}.focus-card img{height:260px}.focus-info{padding:0 1rem 1rem}.focus-prices{grid-template-columns:1fr}.focus-close{left:1rem;top:0}}

/* APPLICATION UX POLISH */
:root{--ease-app:cubic-bezier(.16,1,.3,1)}
*{-webkit-tap-highlight-color:transparent}
button,.btn,.cat,.folder-card,.panel{touch-action:manipulation}
.btn,.icon,.cat,.folder-card,.panel,.add,.heart,.close-card,.focus-close{transition:transform .22s var(--ease-app), box-shadow .28s var(--ease-app), opacity .22s ease, filter .22s ease}
.btn:active,.icon:active,.cat:active,.folder-card:active,.add:active,.heart:active,.close-card:active,.focus-close:active{transform:scale(.93)}
.folder-card{animation:appPop .55s var(--ease-app) both}
.folder-card:nth-child(2){animation-delay:.04s}.folder-card:nth-child(3){animation-delay:.08s}.folder-card:nth-child(4){animation-delay:.12s}.folder-card:nth-child(5){animation-delay:.16s}.folder-card:nth-child(6){animation-delay:.2s}.folder-card:nth-child(7){animation-delay:.24s}
@keyframes appPop{from{opacity:0;transform:translateY(32px) scale(.94);filter:blur(10px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
.product-focus{animation:focusWrap .5s var(--ease-app) both}
@keyframes focusWrap{from{opacity:0;transform:scale(.965);filter:blur(10px)}to{opacity:1;transform:scale(1);filter:blur(0)}}

function openFocus(id){const p=products.find(x=>x.id===id);if(!p)return;selected=p;openCardId=null;productFocus.classList.add('open');focusCard.innerHTML=`<button class="focus-close" onclick="closeFocus()">×</button><img src="${p.img}" alt="${p.name}"><div class="focus-card-body"><div class="focus-card-title">${p.name}</div><div class="focus-card-price">₮${p.pmn.toLocaleString()}</div></div>`;const detailRows={...p.fields,'Төлөв':'Бэлэн / Захиалгаар','Хүргэлт':'УБ хотод 24-48 цаг','Баталгаа':'7 хоног шалгах боломж','Төлбөр':'QPay / шилжүүлэг'};focusInfo.innerHTML=`<div class="focus-back" onclick="closeFocus()">← ${t('Буцах','Back')}</div><div class="flow-line focus-kicker">${catName(p.cat)}</div><div class="flow-line focus-title">${p.name}</div><div class="flow-line focus-desc">${p.desc}</div><div class="flow-line">${Object.entries(detailRows).map(([k,v])=>`<div class="focus-row"><span>${k}</span><b>${v}</b></div>`).join('')}</div><div class="flow-line focus-prices"><div class="focus-price-box"><small>${t('Бэлэн авах үнэ','Ready price')}</small><strong>₮${p.pmn.toLocaleString()}</strong><span>${t('Өнөөдөр авах боломжтой','Available today')}</span></div><div class="focus-price-box"><small>${t('Захиалгаар авах үнэ','Order price')}</small><strong>₮${Math.round(p.pmn*.92).toLocaleString()}</strong><span>${t('Урьдчилгаа захиалга','Pre-order')}</span></div></div><div class="flow-line focus-actions"><button class="btn gold" onclick="startOrder(${p.id})">${t('Захиалах','Order')}</button><button class="btn" onclick="addCart(${p.id})">${t('Сагсанд хийх','Add to cart')}</button></div>`;flowInfo.style.display='none'}

function spinTo(i){closeFocus(false);const total=filtered.slice(0,8).length;if(!total)return;let s=i-idx;if(s<0)s+=total;angle-=360/total*s;idx=i;openCardId=null;renderSpinner();flowInfo.style.display='grid'}
function spinNext(){closeFocus(false);const total=filtered.slice(0,8).length;if(!total)return;idx=(idx+1)%total;angle-=360/total;openCardId=null;renderSpinner();flowInfo.style.display='grid'}
function spinPrev(){closeFocus(false);const total=filtered.slice(0,8).length;if(!total)return;idx=(idx-1+total)%total;angle+=360/total;openCardId=null;renderSpinner();flowInfo.style.display='grid'}

/* SAFE LOGIN AND ADMIN BUILDER PATCH */
(function(){
  var fieldBank = ['Размер','Өнгө','Материал','Батерей','Холболт','Жин','Гэрэлтүүлэг','Баталгаа','Хүргэлт','Загвар'];
  window.isLoggedIn = false;
  window.isAdmin = false;

  window.openLogin = function(){
    var m = $('loginModal');
    if(m) m.classList.add('open');
    setTimeout(function(){ var n = $('loginName'); if(n) n.focus(); },80);
  };
  window.closeLogin = function(){
    var m = $('loginModal');
    if(m) m.classList.remove('open');
  };
  window.login = function(){
    var name = $('loginName') ? $('loginName').value.trim() : 'User';
    var pass = $('loginPass') ? $('loginPass').value.trim() : '';
    window.isLoggedIn = true;
    window.currentUser = name || 'User';
    if(pass === '34admin'){
      window.isAdmin = true;
      closeLogin();
      toast('Admin эрхээр нэвтэрлээ');
      showPage('admin');
    }else{
      window.isAdmin = false;
      closeLogin();
      toast('Амжилттай нэвтэрлээ');
    }
  };

  var baseShowPage = window.showPage;
  window.showPage = function(p){
    if(p === 'admin' && !window.isAdmin){
      openLogin();
      toast('Admin password хэрэгтэй');
      return;
    }
    baseShowPage(p);
  };

  window.adminTab = function(tab,btn){
    document.querySelectorAll('.tab').forEach(function(b){ b.classList.remove('on'); });
    if(btn) btn.classList.add('on');
    renderAdmin(tab);
  };

  function optHtml(){
    return fieldBank.map(function(f){ return '<option value="' + f + '"></option>'; }).join('');
  }
  function refreshFiltered(){
    filtered = cat === 'all' ? products.slice() : products.filter(function(p){ return p.cat === cat; });
  }

  window.renderAdmin = function(tab){
    tab = tab || 'orders';
    var list = $('adminList');
    if(!list) return;

    if(tab === 'orders'){
      if(!orders.length){ list.innerHTML = '<p style="color:var(--muted)">Order алга.</p>'; return; }
      list.innerHTML = orders.map(function(o,i){
        return `<div class="row"><div><b>${o.id} · ${o.product}</b><br><small>${o.phone || ''} · ${o.address || ''}</small><br><small>${o.paid ? 'QPay төлсөн' : 'Дараа төлөх'} · ${o.status || 'Шинэ'} · ${o.date || ''}</small></div><button class="btn danger" onclick="orders.splice(${i},1);renderAdmin('orders')">Устгах</button></div>`;
      }).join('');
      return;
    }

    if(tab === 'cats'){
      var html = `<div class="admin-form"><div class="admin-grid2"><input class="input" id="newCat" placeholder="Category нэр"><input class="input" id="newIcon" placeholder="Icon / emoji"></div><button class="btn gold" onclick="addCatPro()">Category нэмэх</button></div>`;
      html += categories.map(function(c,i){ return `<div class="row"><b>${c.icon} ${c.name}</b><button class="btn danger" onclick="deleteCatPro(${i})">Устгах</button></div>`; }).join('');
      list.innerHTML = html;
      return;
    }

    if(tab === 'products'){
      renderProductAdmin();
    }
  };

  window.addCatPro = function(){
    var n = $('newCat');
    var ic = $('newIcon');
    var name = n ? n.value.trim() : '';
    if(!name){ toast('Category нэр бич'); return; }
    categories.push({id:name.toLowerCase().split(' ').join('_') + Date.now(), name:name, icon:(ic && ic.value.trim()) || '📦'});
    renderCats();
    renderAdmin('cats');
    toast('Category нэмэгдлээ');
  };
  window.deleteCatPro = function(i){
    if(categories[i] && categories[i].id === 'all'){ toast('All category устгахгүй'); return; }
    categories.splice(i,1);
    renderCats();
    renderAdmin('cats');
    toast('Category устлаа');
  };

  window.renderProductAdmin = function(){
    var list = $('adminList');
    if(!list) return;
    var catsHtml = categories.filter(function(c){ return c.id !== 'all'; }).map(function(c){ return `<option value="${c.id}">${c.icon} ${c.name}</option>`; }).join('');
    var html = `<datalist id="fieldKeys">${optHtml()}</datalist>
      <div class="admin-form">
        <div class="admin-grid2"><input class="input" id="pName" placeholder="Барааны нэр"><select class="input" id="pCat">${catsHtml}</select></div>
        <div class="admin-grid2"><input class="input" id="pPrice" type="number" placeholder="Үнэ ₮"><input class="input" id="pUsd" type="number" placeholder="Үнэ $"></div>
        <input class="input" id="pImg" placeholder="Зураг URL">
        <textarea class="input" id="pDesc" placeholder="Тайлбар"></textarea>
        <div class="field-builder"><b>Мэдээллийн мөрүүд</b><p style="color:var(--muted);font-size:.78rem;margin:.25rem 0">Размер, Өнгө, Материал гэх мэт өмнө бичсэнээсээ сонгоод, аль мөрөнд гарах дарааллаа өөрөө тохируулна.</p><div id="fieldLines"></div><button class="btn" onclick="addFieldLine()">+ Мөр нэмэх</button></div>
        <button class="btn gold" onclick="saveProductPro()">Бараа нэмэх</button>
      </div>
      <div style="margin:1rem 0"><b>Өмнө ашигласан талбарууд:</b><div>${fieldBank.map(function(f){return '<span class="chip-admin">' + f + '</span>';}).join('')}</div></div>`;
    html += products.map(function(p){ return `<div class="row"><div><b>${p.name}</b><br><small>${catName(p.cat)} · ₮${Number(p.pmn || 0).toLocaleString()} · $${p.pusd}</small></div><button class="btn danger" onclick="deleteProductPro(${p.id})">Устгах</button></div>`; }).join('');
    list.innerHTML = html;
    addFieldLine('Размер','');
    addFieldLine('Өнгө','');
    addFieldLine('Материал','');
  };

  window.addFieldLine = function(k,v){
    var box = $('fieldLines');
    if(!box) return;
    box.insertAdjacentHTML('beforeend', `<div class="field-line"><input class="input" list="fieldKeys" placeholder="Мөрийн нэр: Размер / Battery" value="${k || ''}"><input class="input" placeholder="Утга" value="${v || ''}"><button class="btn danger" onclick="this.parentElement.remove()">×</button></div>`);
  };

  window.saveProductPro = function(){
    var name = $('pName') ? $('pName').value.trim() : '';
    if(!name){ toast('Барааны нэр бич'); return; }
    var fields = {};
    document.querySelectorAll('#fieldLines .field-line').forEach(function(line){
      var inputs = line.querySelectorAll('input');
      var k = inputs[0] ? inputs[0].value.trim() : '';
      var v = inputs[1] ? inputs[1].value.trim() : '';
      if(k && v){ fields[k] = v; if(fieldBank.indexOf(k) === -1) fieldBank.push(k); }
    });
    products.push({
      id:Date.now(),
      name:name,
      cat:$('pCat').value,
      pmn:Number(($('pPrice') && $('pPrice').value) || 0),
      pusd:Number(($('pUsd') && $('pUsd').value) || 0),
      desc:($('pDesc') && $('pDesc').value) || 'Дэлгэрэнгүй мэдээлэл оруулаагүй.',
      img:($('pImg') && $('pImg').value) || 'https://images.unsplash.com/photo-1618384887929-16ec33fab9ef?w=900&q=80',
      fields:fields
    });
    refreshFiltered();
    renderAll();
    renderProductAdmin();
    toast('Бараа нэмэгдлээ');
  };

  window.deleteProductPro = function(id){
    var i = products.findIndex(function(p){ return p.id === id; });
    if(i > -1){
      products.splice(i,1);
      refreshFiltered();
      renderAll();
      renderProductAdmin();
      toast('Бараа устлаа');
    }
  };
})();


/* PRODUCT FOCUS RIGHT INFO FORCE FIX */
(function(){
  window.openFocus = function(id){
  var p = products.find(function(x){ return x.id === id; });
  if(!p) return;
  selected = p;
  openCardId = null;
  productFocus.classList.add('open');

  var images = p.images && p.images.length ? p.images : [
    p.img,
    p.img,
    p.img
  ];
  var currentIndex = 0;
  var slideTimer = null;

  function renderImage(){
    var wrap = document.querySelector('.focus-img-slider');
    var imgEl = document.getElementById('focusMainImg');
    if(!imgEl) return;
    if(wrap) wrap.classList.add('changing');
    setTimeout(function(){
      imgEl.src = images[currentIndex];
      if(wrap) wrap.classList.remove('changing');
      document.querySelectorAll('.focus-thumbs .thumb').forEach(function(t,i){ t.classList.toggle('active',i===currentIndex); });
    },140);
  }

  var extra = Object.assign({}, p.fields || {});
  extra['Төлөв'] = 'Бэлэн болон захиалгаар авах боломжтой';
  extra['Хүргэлт'] = '24-48 цаг';
  extra['Баталгаа'] = '7 хоног шалгах боломж';
  extra['Төлбөр'] = 'QPay / банкны шилжүүлэг';

  focusCard.innerHTML = '<button class="focus-back-card" onclick="closeFocus()">← Буцах</button>'+
    '<div class="focus-img-slider" id="focusSlider">'+
      '<button class="img-nav left" onclick="prevImg()">‹</button>'+
      '<img id="focusMainImg" src="'+images[0]+'" />'+
      '<button class="img-nav right" onclick="nextImg()">›</button>'+
    '</div>'+
    '<div class="focus-thumbs">'+images.map(function(img,i){return '<img src="'+img+'" onclick="setImg('+i+')" class="thumb '+(i===0?'active':'')+'">';}).join('')+'</div>'+
    '<div class="focus-card-body"><div class="focus-card-title">'+p.name+'</div><div class="focus-card-price">₮'+Number(p.pmn).toLocaleString()+'</div></div>';

  window.setImg = function(i){ currentIndex=i; renderImage(); restartAuto(); };
  window.nextImg = function(){ currentIndex=(currentIndex+1)%images.length; renderImage(); restartAuto(); };
  window.prevImg = function(){ currentIndex=(currentIndex-1+images.length)%images.length; renderImage(); restartAuto(); };
  function restartAuto(){ clearInterval(slideTimer); slideTimer=setInterval(function(){ currentIndex=(currentIndex+1)%images.length; renderImage(); },3600); }
  restartAuto();

  setTimeout(function(){
    var slider=document.getElementById('focusSlider');
    if(!slider)return;
    var sx=0;

    // TOUCH SWIPE
    slider.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
    slider.addEventListener('touchend',function(e){
      var dx=e.changedTouches[0].clientX-sx;
      if(Math.abs(dx)>45){dx<0?nextImg():prevImg()}
    },{passive:true});

    // 360 FAKE ROTATE (mouse / touch move)
    slider.addEventListener('mousemove',function(e){
      var rect=slider.getBoundingClientRect();
      var percent=(e.clientX-rect.left)/rect.width;
      var index=Math.floor(percent*images.length);
      if(index!==currentIndex){
        currentIndex=index;
        renderImage();
      }
    });

    slider.addEventListener('touchmove',function(e){
      var rect=slider.getBoundingClientRect();
      var percent=(e.touches[0].clientX-rect.left)/rect.width;
      var index=Math.floor(percent*images.length);
      if(index!==currentIndex){
        currentIndex=index;
        renderImage();
      }
    },{passive:true});

  },50);

  function rowsHtml(obj){
    var html='';
    Object.keys(obj).forEach(function(k){ html += '<div class="force-row"><span>'+k+'</span><b>'+obj[k]+'</b></div>'; });
    return html;
  }

        var r=slider.getBoundingClientRect();

/* SAFE QPAY AND NOTIFICATION PATCH */
(function(){
  var notifyLog = [];
  var pendingProduct = null;
  function byId(id){ return document.getElementById(id); }
  function cfg(){
    return {
      webhook: localStorage.getItem('notifyWebhook') || '',
      shop: localStorage.getItem('shopName') || '34 Online Shop',
      qname: localStorage.getItem('qpayName') || '34 Online Shop',
      qacc: localStorage.getItem('qpayAccount') || '0000000000',
      qbank: localStorage.getItem('qpayBank') || 'Khan Bank'
    };
  }
  window.saveNotifySettings = function(){
    var w = byId('notifyWebhook');
    var s = byId('shopNameInp');
    var n = byId('qpayNameInp');
    var a = byId('qpayAccountInp');
    var b = byId('qpayBankInp');
    localStorage.setItem('notifyWebhook', w ? w.value : '');
    localStorage.setItem('shopName', s ? s.value : '34 Online Shop');
    localStorage.setItem('qpayName', n ? n.value : '34 Online Shop');
    localStorage.setItem('qpayAccount', a ? a.value : '0000000000');
    localStorage.setItem('qpayBank', b ? b.value : 'Khan Bank');

    renderAdmin('notify');
  };
  var oldRenderAdmin = window.renderAdmin;
  window.renderAdmin = function(tab){
    if(tab === 'notify'){
      var c = cfg();
      var logHtml = notifyLog.length ? notifyLog.join('<hr style="border-color:var(--border)">') : 'Одоогоор notification алга.';
      adminList.innerHTML = '<div class="notify-card"><h3>Notification</h3><p style="color:var(--muted);font-size:.82rem;margin:.4rem 0">Захиалга өгөхөд webhook рүү message илгээнэ. Bot token-оо HTML дотор хийхгүй.</p><input class="input" id="notifyWebhook" placeholder="Webhook URL" value="'+c.webhook+'"><input class="input" id="shopNameInp" placeholder="Shop name" value="'+c.shop+'" style="margin-top:.55rem"></div><div class="notify-card"><h3>QPay тохиргоо</h3><div class="admin-grid2" style="margin-top:.65rem"><input class="input" id="qpayNameInp" placeholder="Дансны нэр" value="'+c.qname+'"><input class="input" id="qpayBankInp" placeholder="Банк" value="'+c.qbank+'"></div><input class="input" id="qpayAccountInp" placeholder="Дансны дугаар" value="'+c.qacc+'" style="margin-top:.55rem"><button class="btn gold" onclick="saveNotifySettings()" style="margin-top:.8rem">Хадгалах</button></div><div class="notify-card"><h3>Notification log</h3><div class="notify-log">'+logHtml+'</div></div>';
      return;
    }
    oldRenderAdmin(tab);
  };
  function makeOrderMessage(o){
    var c = cfg();
    return 'Шинэ захиалга - '+c.shop+' | Бараа: '+o.product+' | Утас: '+(o.phone || '-')+' | Хаяг: '+(o.address || '-')+' | Төлбөр: '+(o.paid ? 'QPay төлсөн' : 'Дараа төлөх')+' | '+o.date;
  }
  function notifyOrder(o){
    var text = makeOrderMessage(o);
    notifyLog.unshift(text);
    var c = cfg();
    if(c.webhook){
      try{
        fetch(c.webhook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text,order:o})}).catch(function(){});
      }catch(err){}
    }
  }
  window.openQpayCheckout = function(product){
    pendingProduct = product;
    var c = cfg();
    var q = byId('qpayModal');
    var body = byId('qpayBody');

    body.innerHTML = '<div class="qpay-title">QPay төлбөр</div><p style="color:var(--muted)">'+product.name+'</p><div class="qpay-amount">₮'+Number(product.pmn).toLocaleString()+'</div><div class="qr-box"></div><div class="pay-apps"><div class="pay-app">Khan Bank</div><div class="pay-app">Golomt</div><div class="pay-app">TDB</div><div class="pay-app">State Bank</div><div class="pay-app">XacBank</div><div class="pay-app">SocialPay</div></div><div class="notify-card" style="text-align:left"><div class="row"><span>Банк</span><b>'+c.qbank+'</b></div><div class="row"><span>Данс</span><b>'+c.qacc+'</b></div><div class="row"><span>Нэр</span><b>'+c.qname+'</b></div></div><button class="btn gold" style="width:100%;margin-top:.8rem" onclick="confirmQpayPaid()">Төлбөр төлөгдсөн</button><button class="btn" style="width:100%;margin-top:.55rem" onclick="closeQpay()">Буцах</button>';
    q.classList.add('open');
  };
  window.closeQpay = function(){ var q = byId('qpayModal'); if(q) q.classList.remove('open'); };
  window.confirmQpayPaid = function(){
    if(!pendingProduct){ closeQpay(); return; }
    var o = {id:'ORD-'+String(orders.length+1).padStart(4,'0'),product:pendingProduct.name,phone:byId('buyerPhone') ? byId('buyerPhone').value : '',address:byId('buyerAddr') ? byId('buyerAddr').value : '',paid:true,date:new Date().toLocaleString(),status:'QPay төлсөн'};
    orders.push(o);
    notifyOrder(o);
    closeQpay();
    closeOrder();
    toast('QPay захиалга баталгаажлаа');
  };
  var oldStartOrder = window.startOrder;
  window.startOrder = function(id){
    oldStartOrder(id);
    setTimeout(function(){
      var btns = document.querySelector('#orderModal .btns');
      if(btns && selected){
        btns.innerHTML = '<button class="btn gold" onclick="openQpayCheckout(selected)">QPay төлөх</button><button class="btn" onclick="confirmOrder(false)">Дараа төлөх</button>';
      }
    },60);
  };
  var oldConfirmOrder = window.confirmOrder;
  window.confirmOrder = function(paid){
    if(paid && selected){ openQpayCheckout(selected); return; }
    var before = orders.length;
    oldConfirmOrder(paid);
    if(orders.length > before){ notifyOrder(orders[orders.length-1]); }
  };
})();
</script>

<script>
/* FOLDER PEEK PREVIEW: dim others + floating product images */
(function(){
  function getFolderImages(catId){
    return products.filter(function(p){return p.cat===catId}).slice(0,4).map(function(p){return p.img});
  }
  function addPeek(card,catId){
    var view=document.getElementById('folderView');
    if(!view || !card) return;
    view.classList.add('previewing');
    card.classList.add('peek');
    var old=card.querySelector('.folder-peek');
    if(old) old.remove();
    var imgs=getFolderImages(catId);
    var wrap=document.createElement('div');
    wrap.className='folder-peek';
    imgs.forEach(function(src,i){
      var im=document.createElement('img');
      im.className='peek-img';
      im.src=src;
      im.style.setProperty('--d',(i*0.055)+'s');
      im.style.setProperty('--r',([-8,7,-4,10][i]||0)+'deg');
      wrap.appendChild(im);
    });
    card.appendChild(wrap);
  }
  function clearPeek(card){
    var view=document.getElementById('folderView');
    if(view) view.classList.remove('previewing');
    document.querySelectorAll('.folder-card.peek').forEach(function(c){c.classList.remove('peek')});
    document.querySelectorAll('.folder-peek').forEach(function(p){p.remove()});
  }
  var oldRenderFolders=window.renderFolders;
  window.renderFolders=function(){
    oldRenderFolders();
    document.querySelectorAll('#folderView .folder-card').forEach(function(card){
      var click=card.getAttribute('onclick') || '';
      var m=click.match(/selectCat\('([^']+)'\)/);
      var catId=m?m[1]:'all';
      card.addEventListener('pointerenter',function(){addPeek(card,catId)});
      card.addEventListener('pointerleave',function(){clearPeek(card)});
      card.addEventListener('touchstart',function(){addPeek(card,catId)}, {passive:true});
      card.addEventListener('touchend',function(){setTimeout(function(){clearPeek(card)},420)}, {passive:true});
    });
  };
})();
</script>

<script>
/* FOLDER PEEK FINAL EVENT SYSTEM */
(function(){
  function imgsFor(catId){
    return products.filter(function(p){return p.cat===catId}).slice(0,4).map(function(p){return p.img});
  }
  function catFromCard(card){
    var raw=card.getAttribute('onclick')||'';
    var m=raw.match(/selectCat\('([^']+)'\)/);
    return m?m[1]:'all';
  }
  function ensureGlow(card){
    var g=card.querySelector('.folder-cursor-glow');
    if(!g){g=document.createElement('div');g.className='folder-cursor-glow';card.prepend(g)}
    return g;
  }
  function openPeek(card,x,y){
    var view=document.getElementById('folderView');
    if(!view||!card)return;
    document.querySelectorAll('.folder-card.peek').forEach(function(c){if(c!==card)c.classList.remove('peek')});
    document.querySelectorAll('.folder-peek').forEach(function(p){p.remove()});
    view.classList.add('previewing');
    card.classList.add('peek');
    var r=card.getBoundingClientRect();
    var glow=ensureGlow(card);
    if(x!=null){glow.style.setProperty('--fx',((x-r.left)/r.width*100)+'%');glow.style.setProperty('--fy',((y-r.top)/r.height*100)+'%')}
    var wrap=document.createElement('div');
    wrap.className='folder-peek';
    imgsFor(catFromCard(card)).forEach(function(src,i){
      var im=document.createElement('img');
      im.className='peek-img';
      im.src=src;
      im.style.setProperty('--d',(i*.055)+'s');
      im.style.setProperty('--r',([-7,5,-4,8][i]||0)+'deg');
      wrap.appendChild(im);
    });
    card.appendChild(wrap);
  }
  function closePeek(){
    var view=document.getElementById('folderView');
    if(view)view.classList.remove('previewing');
    document.querySelectorAll('.folder-card.peek').forEach(function(c){c.classList.remove('peek')});
    document.querySelectorAll('.folder-peek').forEach(function(p){p.remove()});
  }
  document.addEventListener('pointermove',function(e){
    var card=e.target.closest && e.target.closest('#folderView .folder-card');
    if(!card)return;
    var glow=ensureGlow(card),r=card.getBoundingClientRect();
    glow.style.setProperty('--fx',((e.clientX-r.left)/r.width*100)+'%');
    glow.style.setProperty('--fy',((e.clientY-r.top)/r.height*100)+'%');
  });
  document.addEventListener('pointerover',function(e){
    var card=e.target.closest && e.target.closest('#folderView .folder-card');
    if(card)openPeek(card,e.clientX,e.clientY);
  });
  document.addEventListener('pointerout',function(e){
    if(e.target.closest && e.target.closest('#folderView')){
      var to=e.relatedTarget;
      if(!to || !(to.closest&&to.closest('#folderView .folder-card')))closePeek();
    }
  });
  document.addEventListener('touchstart',function(e){
    var card=e.target.closest && e.target.closest('#folderView .folder-card');
    if(card)openPeek(card,e.touches[0].clientX,e.touches[0].clientY);
  },{passive:true});
  document.addEventListener('touchend',function(){setTimeout(closePeek,520)},{passive:true});
})();
</script>

<script>
/* GLOBAL PREMIUM CURSOR / TOUCH FOLLOWER */
(function(){
  var orb=document.getElementById('cursorOrb');
  var dot=document.getElementById('cursorDot');
  if(!orb||!dot)return;
  var tx=window.innerWidth/2,ty=window.innerHeight/2;
  var ox=tx,oy=ty,dx=tx,dy=ty;
  function move(x,y){tx=x;ty=y;document.body.classList.add('cursor-active')}
  function loop(){
    ox+=(tx-ox)*0.12; oy+=(ty-oy)*0.12;
    dx+=(tx-dx)*0.35; dy+=(ty-dy)*0.35;
    orb.style.transform='translate3d('+ox+'px,'+oy+'px,0) translate(-50%,-50%)';
    dot.style.transform='translate3d('+dx+'px,'+dy+'px,0) translate(-50%,-50%)';
    requestAnimationFrame(loop);
  }
  window.addEventListener('pointermove',function(e){move(e.clientX,e.clientY)},{passive:true});
  window.addEventListener('pointerdown',function(e){move(e.clientX,e.clientY);document.body.classList.add('cursor-pressing')},{passive:true});
  window.addEventListener('pointerup',function(){document.body.classList.remove('cursor-pressing')},{passive:true});
  window.addEventListener('pointerleave',function(){document.body.classList.remove('cursor-active')},{passive:true});
  window.addEventListener('touchmove',function(e){if(e.touches&&e.touches[0])move(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
  window.addEventListener('touchstart',function(e){if(e.touches&&e.touches[0])move(e.touches[0].clientX,e.touches[0].clientY);document.body.classList.add('cursor-pressing')},{passive:true});
  window.addEventListener('touchend',function(){document.body.classList.remove('cursor-pressing')},{passive:true});
  loop();
})();
</script>
