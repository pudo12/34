<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>34 Online Shop - UI Version</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #f5f7fb;
            --sidebar-bg: #ffffff;
            --accent-blue: #5c67f2;
            --text-main: #2d3142;
            --text-sub: #9094a6;
            --card-bg: #ffffff;
            --shadow: 0 10px 30px rgba(0,0,0,0.05);
            --gold: #c8a96e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--primary-bg); font-family: 'DM Sans', sans-serif; color: var(--text-main); display: flex; min-height: 100vh; }

        /* SIDEBAR */
        .sidebar { width: 100px; background: var(--sidebar-bg); border-right: 1px solid #eee; display: flex; flex-direction: column; align-items: center; padding: 30px 0; position: fixed; height: 100vh; }
        .sidebar .logo { font-family: 'Playfair Display', serif; font-size: 32px; color: var(--gold); margin-bottom: 50px; }
        .nav-icons { display: flex; flex-direction: column; gap: 30px; }
        .nav-item { cursor: pointer; opacity: 0.4; transition: 0.3s; font-size: 24px; list-style: none; }
        .nav-item:hover, .nav-item.active { opacity: 1; color: var(--accent-blue); }

        /* MAIN CONTENT */
        .content { margin-left: 100px; flex: 1; padding: 40px; }
        
        /* HEADER / SEARCH */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .search-bar { background: white; padding: 12px 25px; border-radius: 12px; width: 400px; box-shadow: var(--shadow); border: none; outline: none; }
        .user-profile { display: flex; align-items: center; gap: 15px; background: white; padding: 8px 20px; border-radius: 50px; box-shadow: var(--shadow); cursor: pointer; }

        /* CATEGORIES */
        .categories { display: flex; gap: 15px; margin-bottom: 30px; overflow-x: auto; padding-bottom: 10px; }
        .cat-btn { padding: 10px 25px; background: white; border-radius: 12px; cursor: pointer; border: none; font-weight: 500; transition: 0.3s; white-space: nowrap; box-shadow: var(--shadow); }
        .cat-btn.active { background: var(--gold); color: white; }

        /* PRODUCT GRID */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
        .card { background: white; border-radius: 24px; padding: 20px; transition: 0.3s; position: relative; box-shadow: var(--shadow); border: 2px solid transparent; }
        .card:hover { transform: translateY(-10px); border-color: var(--gold); }
        .img-box { width: 100%; aspect-ratio: 1/1; background: #f0f2f5; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 60px; margin-bottom: 15px; overflow: hidden; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .card-title { font-weight: 700; font-size: 16px; margin-bottom: 5px; }
        .card-meta { color: var(--text-sub); font-size: 13px; margin-bottom: 15px; }
        .price-row { display: flex; justify-content: space-between; align-items: center; }
        .price { font-weight: 700; color: var(--gold); }
        .add-btn { background: var(--primary-bg); border: none; width: 35px; height: 35px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 18px; }
        .add-btn:hover { background: var(--gold); color: white; }

        /* SIZE SELECTOR IN CARD */
        .size-badge { font-size: 10px; background: #eee; padding: 2px 6px; border-radius: 4px; margin-right: 4px; }

        /* MODAL & UI OVERLAYS */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.2); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .overlay.open { display: flex; }
        .modal { background: white; padding: 40px; border-radius: 32px; width: 90%; max-width: 450px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); }
        
        /* FORM STYLES */
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; }
        .input-group input, .input-group select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #eee; background: #f9f9f9; outline: none; }

        /* TOAST */
        .toast { position: fixed; top: 30px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #2d3142; color: white; padding: 15px 40px; border-radius: 15px; transition: 0.5s; z-index: 2000; }
        .toast.show { transform: translateX(-50%) translateY(0); }

        .cart-count { background: #ff4d4d; color: white; font-size: 10px; padding: 2px 6px; border-radius: 50px; position: absolute; top: -5px; right: -5px; }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="logo">34</div>
    <ul class="nav-icons">
        <li class="nav-item active">🏠</li>
        <li class="nav-item" onclick="toggleCart()">🛒 <span id="cart-counter" class="cart-count">0</span></li>
        <li class="nav-item">🔥</li>
        <li class="nav-item">⭐</li>
        <li class="nav-item" onclick="openAddModal()" title="Бараа нэмэх">➕</li>
        <li class="nav-item">⚙️</li>
    </ul>
</aside>

<main class="content">
    <header class="header">
        <input type="text" class="search-bar" placeholder="Бараа хайх..." onkeyup="searchProduct(this.value)">
        <div class="user-profile" onclick="openAuth()">
            <span>👤</span>
            <span id="user-name">Нэвтрэх</span>
        </div>
    </header>

    <div class="categories" id="cat-list">
        <button class="cat-btn active" onclick="filterCat('all', this)">All Games</button>
        <button class="cat-btn" onclick="filterCat('clothes', this)">👗 Clothes</button>
        <button class="cat-btn" onclick="filterCat('electronics', this)">📱 Gadgets</button>
        <button class="cat-btn" onclick="filterCat('accessories', this)">⌚ Accessories</button>
    </div>

    <div class="grid" id="product-grid">
        </div>
</main>

<div class="overlay" id="add-modal">
    <div class="modal">
        <h2 style="margin-bottom: 20px;">Шинэ бараа нэмэх</h2>
        <div class="input-group">
            <label>Барааны нэр</label>
            <input type="text" id="p-name" placeholder="Жишээ: Air Jordan 1">
        </div>
        <div class="input-group">
            <label>Үнэ (₮)</label>
            <input type="number" id="p-price" placeholder="250000">
        </div>
        <div class="input-group">
            <label>Ангилал</label>
            <select id="p-cat">
                <option value="clothes">Хувцас</option>
                <option value="electronics">Техник</option>
                <option value="accessories">Аксессуар</option>
            </select>
        </div>
        <div class="input-group">
            <label>Боломжит хэмжээ (Size) - Таслалаар тусгаарла</label>
            <input type="text" id="p-size" placeholder="S, M, L эсвэл 40, 41, 42">
        </div>
        <div class="input-group">
            <label>Emoji (Зургийн оронд)</label>
            <input type="text" id="p-emoji" placeholder="👟">
        </div>
        <button class="cat-btn active" style="width: 100%; padding: 15px;" onclick="saveProduct()">Барааг хадгалах</button>
        <button style="width: 100%; background: none; border: none; margin-top: 15px; cursor: pointer; color: #888;" onclick="closeModals()">Цуцлах</button>
    </div>
</div>

<div class="overlay" id="cart-modal">
    <div class="modal" style="max-width: 500px;">
        <h2>Таны сагс</h2>
        <div id="cart-items" style="margin: 20px 0; max-height: 300px; overflow-y: auto;">
            </div>
        <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 20px;">
            <span>Нийт:</span>
            <span id="cart-total">₮0</span>
        </div>
        <button class="cat-btn active" style="width: 100%; padding: 15px; margin-top: 20px;" onclick="checkout()">Захиалга хийх</button>
        <button style="width: 100%; background: none; border: none; margin-top: 15px; cursor: pointer;" onclick="closeModals()">Хаах</button>
    </div>
</div>

<div class="toast" id="toast">Мэдэгдэл!</div>

<script>
    let products = [
        {id: 1, name: "Premium Hoodie", price: 125000, cat: "clothes", size: ["S", "M", "L", "XL"], emoji: "🧥", rating: 4.8},
        {id: 2, name: "Smart Watch V2", price: 450000, cat: "accessories", size: ["40mm", "44mm"], emoji: "⌚", rating: 4.5},
        {id: 3, name: "AirPods Pro", price: 890000, cat: "electronics", size: ["Standard"], emoji: "🎧", rating: 4.9},
        {id: 4, name: "Running Sneakers", price: 210000, cat: "clothes", size: ["40", "41", "42", "43"], emoji: "👟", rating: 4.7},
        {id: 5, name: "Gaming Mouse", price: 185000, cat: "electronics", size: ["One Size"], emoji: "🖱️", rating: 4.6}
    ];
    let cart = [];

    function renderProducts(data = products) {
        const grid = document.getElementById('product-grid');
        grid.innerHTML = data.map(p => `
            <div class="card">
                <div class="img-box">${p.emoji}</div>
                <div class="card-title">${p.name}</div>
                <div class="card-meta">
                    ⭐ ${p.rating || 5.0} | ${p.size.map(s => `<span class="size-badge">${s}</span>`).join('')}
                </div>
                <div class="price-row">
                    <div class="price">₮${p.price.toLocaleString()}</div>
                    <button class="add-btn" onclick="addToCart(${p.id})">+</button>
                </div>
            </div>
        `).join('');
    }

    function addToCart(id) {
        const product = products.find(p => p.id === id);
        cart.push(product);
        updateCartUI();
        showToast(product.name + " сагсанд орлоо!");
    }

    function updateCartUI() {
        document.getElementById('cart-counter').textContent = cart.length;
        const container = document.getElementById('cart-items');
        let total = 0;
        container.innerHTML = cart.map((item, index) => {
            total += item.price;
            return `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:10px;">
                    <div><b>${item.name}</b><br><small>₮${item.price.toLocaleString()}</small></div>
                    <button onclick="removeFromCart(${index})" style="background:none; border:none; color:red; cursor:pointer;">Устгах</button>
                </div>
            `;
        }).join('');
        document.getElementById('cart-total').textContent = '₮' + total.toLocaleString();
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCartUI();
    }

    function filterCat(cat, btn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if(cat === 'all') renderProducts();
        else renderProducts(products.filter(p => p.cat === cat));
    }

    function searchProduct(val) {
        const filtered = products.filter(p => p.name.toLowerCase().includes(val.toLowerCase()));
        renderProducts(filtered);
    }

    function openAddModal() { document.getElementById('add-modal').classList.add('open'); }
    function toggleCart() { document.getElementById('cart-modal').classList.add('open'); }
    function closeModals() { document.querySelectorAll('.overlay').forEach(o => o.classList.remove('open')); }

    function saveProduct() {
        const name = document.getElementById('p-name').value;
        const price = document.getElementById('p-price').value;
        const cat = document.getElementById('p-cat').value;
        const sizeInput = document.getElementById('p-size').value;
        const emoji = document.getElementById('p-emoji').value;

        if(!name || !price) { alert("Мэдээллээ бүрэн оруулна уу!"); return; }

        const newP = {
            id: Date.now(),
            name: name,
            price: parseInt(price),
            cat: cat,
            size: sizeInput.split(',').map(s => s.trim()),
            emoji: emoji || "📦",
            rating: 5.0
        };

        products.unshift(newP);
        renderProducts();
        closeModals();
        showToast("Шинэ бараа амжилттай нэмэгдлээ!");
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    function checkout() {
        if(cart.length === 0) return;
        alert("Захиалга хүлээн авлаа! Төлбөр хүлээгдэж байна.");
        cart = [];
        updateCartUI();
        closeModals();
    }

    // Анхны ачаалалт
    renderProducts();
</script>

</body>
</html>
