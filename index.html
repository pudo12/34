<!DOCTYPE html>
<html lang="mn" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>34 | Minimal Site</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  /* Өнгөний тохиргоо (Variables) */
  :root {
    --bg: #f8f9fc;
    --text: #1a1a1a;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --accent: #1a56db;
  }

  /* DARK MODE ТОХИРГОО - ЭНД БҮРЭН ХАР БОЛГОЛОО */
  [data-theme="dark"] {
    --bg: #000000;      /* Бүрэн хар дэвсгэр */
    --text: #ffffff;    /* Тод цагаан үсэг */
    --card-bg: #111111; /* Картууд нь арай сааралдуу хар */
    --border: #333333;  /* Хүрээ зураас */
    --accent: #3b82f6;
  }

  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background-color: var(--bg);
    color: var(--text);
    transition: all 0.3s ease;
  }

  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 5%;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  .logo {
    font-size: 1.8rem;
    font-weight: 700;
    border: 2px solid var(--text);
    padding: 0 8px;
  }

  .theme-toggle {
    cursor: pointer;
    padding: 8px 15px;
    border: 1px solid var(--text);
    background: transparent;
    color: var(--text);
    font-weight: 600;
  }

  .hero {
    text-align: center;
    padding: 4rem 5%;
  }

  .container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 2rem;
    padding: 2rem 5%;
  }

  .card {
    background: var(--card-bg);
    padding: 2rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    text-align: center;
    transition: 0.3s;
  }

  .card:hover {
    border-color: var(--accent);
  }

  .btn {
    display: inline-block;
    margin-top: 1rem;
    padding: 10px 20px;
    background: var(--text);
    color: var(--bg);
    text-decoration: none;
    border-radius: 4px;
    font-size: 0.9rem;
  }

  footer {
    text-align: center;
    padding: 3rem;
    font-size: 0.8rem;
    opacity: 0.7;
  }
</style>
</head>
<body>

<nav>
  <div class="logo">34</div>
  <button class="theme-toggle" onclick="toggleTheme()">Dark Mode</button>
</nav>

<section class="hero">
  <h1>Explore. Learn. Connect.</h1>
  <p>Minimalist platform for your digital journey.</p>
</section>

<div class="container">
  <div class="card">
    <h2>Online Shop</h2>
    <p>Curated premium products.</p>
    <a href="#" class="btn">Shop Now</a>
  </div>
  <div class="card">
    <h2>Training</h2>
    <p>Expert-led digital courses.</p>
    <a href="#" class="btn">Learn More</a>
  </div>
  <div class="card">
    <h2>Blog</h2>
    <p>Insights and AI tutorials.</p>
    <a href="#" class="btn">Read Posts</a>
  </div>
</div>

<footer>
  &copy; 2026 "34" Брэнд.
</footer>

<script>
  function toggleTheme() {
    const html = document.documentElement;
    const btn = document.querySelector('.theme-toggle');
    
    if (html.getAttribute('data-theme') === 'light') {
      html.setAttribute('data-theme', 'dark');
      btn.innerText = 'Light Mode';
    } else {
      html.setAttribute('data-theme', 'light');
      btn.innerText = 'Dark Mode';
    }
  }
</script>

</body>
</html>
